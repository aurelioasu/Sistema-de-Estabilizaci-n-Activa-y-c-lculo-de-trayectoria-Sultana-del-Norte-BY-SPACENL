      <g transform="translate(164)"><rect width="160" height="44" rx="22" fill="#252b33" stroke="#555d67"/><text x="80" y="28" text-anchor="middle" fill="#ffffff">4 CANARDS</text></g>
      <g transform="translate(340)"><rect width="176" height="44" rx="22" fill="#252b33" stroke="#555d67"/><text x="88" y="28" text-anchor="middle" fill="#ffffff">TELEMETRÍA</text></g>
      <g transform="translate(532)"><rect width="205" height="44" rx="22" fill="#252b33" stroke="#555d67"/><text x="102.5" y="28" text-anchor="middle" fill="#ffffff">SIMULACIÓN 6-DOF</text></g>
    </g>
  </g>

  <path d="M 630 504 H 1512" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="632" y="531" fill="#727b85" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="1">DISEÑO ABIERTO A AUDITORÍA · ACTUACIÓN BLOQUEADA POR DEFECTO</text>
